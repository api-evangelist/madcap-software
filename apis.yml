aid: madcap-software
name: MadCap Software
description: >-
  MadCap Software is an enterprise content authoring, management, and delivery
  company for technical documentation and learning & development teams. Its
  platform spans MadCap Flare (topic-based technical authoring with
  single-source, multi-channel publishing to HTML5, PDF, Word, EPUB, and
  SCORM), MadCap Flare Online (cloud collaborative authoring and review), MadCap
  IXIA CCMS (enterprise DITA component content management for regulated
  industries), MadCap Syndicate (AI-ready, governed content delivery to portals,
  LMS, CRM, and RAG pipelines), MadCap Create (eLearning authoring), MadCap Lingo
  (translation management), and MadCap Contributor. MadCap serves 25,000+ users
  and 3,000+ customers including 3M, T-Mobile, Wells Fargo, and Rivian. The
  company's developer surface is the .NET Flare Plug-In API and Help Viewer SDK
  plus the MadCap Connect connectors for Salesforce, Zendesk, and ServiceNow;
  it does not publish a public REST/HTTP API. Added to the API Evangelist
  network from the Battery Ventures portfolio and enriched from its public
  documentation surface.
